apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: duckdns
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://csp33.github.io/cert-manager-duckdns-webhook'
    chart: csp33
    targetRevision: v1.1.3
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=true