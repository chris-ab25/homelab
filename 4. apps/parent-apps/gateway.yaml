apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-routes
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/chris-ab25/homelab'
    targetRevision: HEAD
    path: '4. apps/gateway'
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true