apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-route
  namespace: argocd
spec:
  parentRefs:
    - name: eg-gateway         # Name of your Gateway resource
      namespace: default       # Namespace where your Gateway lives (if different)
  hostnames:
    - "argocd.chrisab25.duckdns.org"    # Replace with your domain
  rules:
      backendRefs:
        - name: argocd-server  # Argo CD API Server Service name
          port: 80