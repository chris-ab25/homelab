apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-route
  namespace: argocd
spec:
  parentRefs:
    - name: main-gateway
      namespace: gateway-system
  hostnames:
    - "argocd.chrisab25.duckdns.org"
  rules:
    - backendRefs:
      - name: argocd-server
        port: 80